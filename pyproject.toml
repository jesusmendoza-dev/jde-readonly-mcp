[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jde-readonly-mcp"
version = "0.1.0"
description = "Read-only Model Context Protocol (MCP) server for JD Edwards EnterpriseOne on Oracle Database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Jesús Mendoza" },
]
keywords = ["mcp", "jd-edwards", "jde", "oracle", "readonly", "erp", "ai-integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    "mcp>=1.2.0",
    "oracledb>=2.5.0",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
jde-readonly-mcp = "jde_readonly_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
